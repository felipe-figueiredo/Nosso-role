<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182b28"><meta name="apple-mobile-web-app-capable" content="yes"><title>Nosso Rolê</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#182b28;background:#f7f5f0}*{box-sizing:border-box}body{margin:0}header{background:#182b28;color:white;padding:40px 20px 24px}h1{margin:0;font-size:34px}header p{opacity:.8}main{max-width:650px;margin:auto;padding:18px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#dbe7dd;color:#182b28;font-weight:700}.primary,.active{background:#182b28;color:white}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #182b2810}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1}.muted{color:#65746e}.score{font-size:26px;font-weight:800;color:#287657}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd4cf;border-radius:10px;background:white}textarea{min-height:70px}.hidden{display:none}.notice{background:#fff1d2;padding:12px;border-radius:12px}.tiny{font-size:13px}footer{text-align:center;padding:25px;color:#77837b}</style></head><body><header><h1>🍷 Nosso Rolê</h1><p>Os melhores lugares, escolhidos por nós ♡</p></header><main><div id="status" class="notice">Configure a conexão para começar.</div><section id="setup" class="card"><h3>⚙️ Conectar Supabase</h3><label>Project URL</label><input id="url" placeholder="https://xxxx.supabase.co"><label>Publishable key</label><input id="key" placeholder="sb_publishable_..."><button class="primary" onclick="saveConfig()">Salvar conexão</button><p class="muted tiny">Use somente a chave pública. Nunca use uma chave secreta.</p></section><section id="auth" class="card hidden"><h3>Entrar no Nosso Rolê</h3><label>Email</label><input id="email" type="email"><label>Senha</label><input id="password" type="password"><div class="row" style="margin-top:12px"><button class="primary" onclick="login(false)">Entrar</button><button onclick="login(true)">Criar conta</button></div></section><section id="app" class="hidden"><div class="row"><span id="who" class="muted tiny"></span><button onclick="logout()">Sair</button></div><div class="tabs"><button id="tab-restaurante" class="active" onclick="setCategory('restaurante')">🍽️ Restaurantes</button><button id="tab-bar" onclick="setCategory('bar')">🍺 Bares</button></div><div class="row"><h2 id="heading">Ranking de restaurantes</h2><button class="primary" onclick="newPlace()">+ Avaliar</button></div><div id="places"></div><section id="editor" class="card hidden"><h2 id="formtitle">Nova avaliação</h2><label>Nome do lugar</label><input id="name" maxlength="100"><label>Bairro</label><input id="neighborhood" maxlength="100"><div id="criteria"></div><label>Meu comentário</label><textarea id="notes"></textarea><div class="row" style="margin-top:14px"><button class="primary" onclick="savePlace()">Salvar</button><button onclick="closeEditor()">Cancelar</button></div></section></section></main><footer>Feito para dois ♡</footer><script>const criteria={restaurante:['Comida','Ambiente','Atendimento','Custo-benefício'],bar:['Bebidas','Ambiente','Atendimento','Custo-benefício']};const $=id=>document.getElementById(id);let config=JSON.parse(localStorage.getItem('nosso-role-config')||'null'),session=null,category='restaurante',places=[],ratings=[],editing=null;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function status(s){$('status').textContent=s}function saveConfig(){let url=$('url').value.trim().replace(/\/$/,''),key=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!key||key.includes('sb_secret_')||key.includes('service_role'))return alert('Confira URL e chave pública.');config={url,key};localStorage.setItem('nosso-role-config',JSON.stringify(config));$('setup').classList.add('hidden');$('auth').classList.remove('hidden');status('Conexão configurada. Entre ou crie sua conta.')}async function api(method,path,body,auth=true){let headers={'apikey':config.key,'Content-Type':'application/json'};if(auth&&session)headers.Authorization='Bearer '+session.access_token;let r=await fetch(config.url+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});let t=await r.text(),d=t?JSON.parse(t):null;if(!r.ok)throw Error(d?.msg||d?.message||d?.error_description||t);return d}async function login(signup){try{let email=$('email').value.trim(),password=$('password').value;if(!email||!password)return alert('Preencha email e senha.');let d=await api('POST',signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{email,password},false);if(signup&&!d.access_token){status('Conta criada. Confirme seu email e depois entre.');return}session=d;localStorage.setItem('nosso-role-session',JSON.stringify(session));await start()}catch(e){alert(e.message)}}async function start(){if(!session)return;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=session.user?.email||'';await load()}function logout(){session=null;localStorage.removeItem('nosso-role-session');$('app').classList.add('hidden');$('auth').classList.remove('hidden');status('Faça login para continuar.')}async function load(){try{places=await api('GET','/rest/v1/lugares?select=*&order=criado_em.desc');ratings=await api('GET','/rest/v1/avaliacoes?select=*');status('✓ Sincronização online ativa');render()}catch(e){status('Erro ao carregar: '+e.message)}}function average(a){return a.length?a.reduce((s,x)=>s+Number(x.nota),0)/a.length:null}function render(){let list=places.filter(p=>p.categoria===category).map(p=>({...p,avg:average(ratings.filter(a=>a.lugar_id===p.id))})).sort((a,b)=>(b.avg??-1)-(a.avg??-1));$('places').innerHTML=list.length?list.map((p,i)=>{let rr=ratings.filter(a=>a.lugar_id===p.id),mine=rr.find(a=>a.usuario_id===session.user.id);return '<div class="card"><div class="row"><div><strong>'+ (i+1)+'º · '+esc(p.nome)+'</strong><p class="muted">'+esc(p.bairro||'')+'</p></div><div class="score">'+(p.avg===null?'–':p.avg.toFixed(1))+' ★</div></div><p class="muted tiny">'+rr.length+' avaliação(ões)'+(rr.length===1?' · Aguardando segunda nota':'')+'</p>'+rr.map(a=>'<p class="tiny">'+(a.usuario_id===session.user.id?'Minha nota':'Outra nota')+': '+esc(a.nota)+' ★ '+esc(a.comentario||'')+'</p>').join('')+'<button onclick="editPlace(\''+p.id+'\')">'+(mine?'Editar minha nota':'Avaliar')+'</button></div>'}).join(''):'<div class="card muted">Ainda não há avaliações. Toque em + Avaliar.</div>'}function setCategory(c){category=c;$('heading').textContent='Ranking de '+(c==='bar'?'bares':'restaurantes');['bar','restaurante'].forEach(x=>$('tab-'+x).classList.toggle('active',x===c));closeEditor();render()}function closeEditor(){$('editor').classList.add('hidden')}function buildCriteria(v={}){$('criteria').innerHTML=criteria[category].map((c,i)=>'<label>'+c+'</label><select id="rating'+i+'">'+Array.from({length:10},(_,j)=>j+1).map(n=>'<option value="'+n+'" '+(n===Number(v[c]??8)?'selected':'')+'>'+n+'</option>').join('')+'</select>').join('')}function newPlace(){editing=null;$('formtitle').textContent='Nova avaliação';$('name').disabled=false;$('name').value='';$('neighborhood').value='';$('notes').value='';buildCriteria();$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth'})}function editPlace(id){let p=places.find(x=>x.id===id);if(!p)return;editing=id;let mine=ratings.find(a=>a.lugar_id===id&&a.usuario_id===session.user.id);$('formtitle').textContent='Minha avaliação';$('name').value=p.nome;$('name').disabled=true;$('neighborhood').value=p.bairro||'';$('notes').value=mine?.comentario||'';buildCriteria(mine?.criterios||{});$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth'})}async function savePlace(){try{let nome=$('name').value.trim();if(!nome)return alert('Informe o nome.');let id=editing;if(!id){let p=await api('POST','/rest/v1/lugares?select=*',{nome,categoria:category,bairro:$('neighborhood').value.trim()});id=p?.[0]?.id;if(!id){await load();id=places.find(x=>x.nome===nome&&x.categoria===category)?.id}if(!id)throw Error('Não foi possível identificar o lugar.')}let criterios={};criteria[category].forEach((c,i)=>criterios[c]=Number($('rating'+i).value));let nota=Object.values(criterios).reduce((a,b)=>a+b,0)/4;await api('POST','/rest/v1/avaliacoes?on_conflict=lugar_id,usuario_id',{lugar_id:id,usuario_id:session.user.id,nota,criterios,comentario:$('notes').value.trim(),atualizado_em:new Date().toISOString()});closeEditor();await load()}catch(e){alert('Erro ao salvar: '+e.message)}}if(config){$('url').value=config.url;$('key').value=config.key;$('setup').classList.add('hidden');$('auth').classList.remove('hidden');let saved=JSON.parse(localStorage.getItem('nosso-role-session')||'null');if(saved){session=saved;start()}};</script></body></html>
